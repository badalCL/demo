<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT UI Clone</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>

<body>
<!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            <i class="fa-brands fa-openai"></i>
        </div>

        <button class="new-chat">
            <i class="fa-solid fa-pen"></i>
            New chat
        </button>

        <div class="menu">
            <div class="menu-item">
                <i class="fa-solid fa-magnifying-glass"></i>
                Search chats
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-folder"></i>
                Projects
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-code"></i>
                Codex
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-compass"></i>
                Explore GPTs
            </div>
        </div>

        <div class="menu">
          <div class="menu-item"><b>Recent Chats</b></div>
          <div class="menu-item">Chat 1</div>
          <div class="menu-item">Chat 2</div>
          <div class="menu-item">Chat 3</div>
          <div class="menu-item">Chat 4</div>
          <div class="menu-item">Chat 5</div>
          <div class="menu-item">Chat 6</div>
          <div class="menu-item">Chat 7</div>
          <div class="menu-item">Chat 8</div>
          <div class="menu-item">Chat 9</div>

        </div>


    </div>
  <div class="main">

    <div class="header">
      <div class="header-left">
        <h2>ChatGPT</h2>
        <i class="fa-solid fa-angle-down"></i>
      </div>

      <i class="fa-regular fa-circle user-icon"></i>
    </div>



    <div class="center">
      <h1>What are you working on?</h1>

      <div class="search-box">

        <div class="left-search">
          <i class="fa-solid fa-plus"></i>
          <input type="text" placeholder="Ask anything">
        </div>

        <div class="right-search">
          <i class="fa-solid fa-microphone"></i>

          <div class="voice-btn">
            <i class="fa-solid fa-wave-square"></i>
          </div>
        </div>

      </div>


      <div class="buttons">

        <button>
          <i class="fa-regular fa-image"></i>
          Create an image
        </button>

        <button>
          <i class="fa-regular fa-pen-to-square"></i>
          Write or edit
        </button>

        <button>
          <i class="fa-solid fa-globe"></i>
          Look something up
        </button>

      </div>

    </div>

  </div>

</body>
</html>
